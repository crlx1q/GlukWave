<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlukWave</title><style>@font-face{font-family:Nunito;src:url('/assets/nunito.ttf')}*{box-sizing:border-box}body{margin:0;background:var(--bg,#302f2c);color:var(--ink,#efede3);font:13px Nunito,sans-serif;padding:12px}header{display:flex;gap:12px;align-items:center}img{width:46px;height:46px;border-radius:10px;object-fit:cover}b{display:block;font-size:15px}small{opacity:.75;display:block}section{display:flex;align-items:center;justify-content:center;gap:20px;margin:10px 0 2px}button{border:0;background:#ffffff12;color:inherit;width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px;display:grid;place-items:center}input{width:100%}button:disabled{opacity:.4;cursor:default}button:active:not(:disabled){transform:scale(.94)}p{margin:0;min-width:0;flex:1}b,small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}.times{display:flex;justify-content:space-between;font-size:11px;opacity:.8}button:focus-visible,input:focus-visible{outline:2px solid #d19d75;outline-offset:3px}</style></head><body><div id="root"></div><script type="module" src="/src/mini.tsx"></script></body></html>
