org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
android.enableJetifier=true
# Test-only Robolectric cryptography jars need no Android support rewriting.
android.jetifier.ignorelist=bcprov-jdk18on,bcpkix-jdk18on,bcutil-jdk18on
