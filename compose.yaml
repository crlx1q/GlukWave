services:
  wave:
    build: .
    restart: unless-stopped
    # Budget for the shared Oracle host; includes Python/FFmpeg child processes.
    cpus: 1.0
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      APP_URL: https://wave.gluk.tech
      ALLOWED_ORIGINS: https://wave.gluk.tech
      REQUIRE_EMAIL_VERIFICATION: 'true'
      TRUST_PROXY: 1
      RELEASES_DIR: /app/releases
      NODE_OPTIONS: --max-old-space-size=2048
      EXTRACTOR_CONCURRENCY: 1
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - ./var:/app/var
      - ./outputs:/app/releases:ro
