  <section class="scr" id="s1">
    <div class="hd"><h1>Поиск</h1></div>
    <label class="sb"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="inp" placeholder="Треки и артисты" autocomplete="off" enterkeyhint="search"></label>
    <div id="sres"></div>
    <div class="skel" id="k1"></div>
    <div class="real" id="gen"><div class="sec"><h2>Жанры и настроения</h2><div class="gg" id="gg"></div></div></div>
  </section>

  <section class="scr" id="s2">
    <div class="hd"><h1>Медиатека</h1></div>
    <div class="skel" id="k2"></div>
    <div class="real" id="lib"></div>
  </section>

  <div class="mini" id="mini" role="button" tabindex="0" aria-label="Открыть плеер">
    <div class="msk"><i class="sk" style="width:44px;height:44px"></i><div style="flex:1"><i class="sk" style="width:55%;height:12px;margin-bottom:8px"></i><i class="sk" style="width:35%;height:10px"></i></div></div>
    <div class="mw" id="mw"><div class="mc" id="mc"><div id="mcv"></div><div class="mt"><b id="mT"></b><span id="mA"></span></div></div><div class="mn" id="mn"></div></div>
    <button class="hrt" id="mlk" aria-label="Нравится"></button>
    <button class="pp" id="mpp" aria-label="Играть или пауза"></button><u id="mu"></u>
  </div>

  <nav class="tabs" id="tabs">
    <button class="on" aria-label="Главная"><svg class="i" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
    <button aria-label="Поиск"><svg class="i ns" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Поиск</button>
    <button aria-label="Медиатека"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="5" height="16" rx="1.500"/><rect x="11" y="4" width="4" height="16" rx="1.500"/><path d="m17.500 6 3 13"/></svg>Медиатека</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sh" id="sh" aria-hidden="true">
    <div class="top"><button id="shx" aria-label="Свернуть"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v15M5 13l7 7 7-7"/></svg></button><span>Сейчас играет</span><span style="width:44px"></span></div>
    <div class="stage"><div class="big" id="big"></div></div>
    <div class="meta" id="meta"><div><h3 id="pT"></h3><p id="pA"></p></div></div>
    <div class="bar" id="bar" role="slider" aria-label="Позиция" tabindex="0"><div class="fl" id="fl"></div><div class="th" id="th"></div></div>
    <div class="tm"><span id="cu">0:00</span><span id="du"></span></div>
    <div class="ct"><button class="rd" id="pv" aria-label="Назад"></button><button class="pl" id="ppl" aria-label="Играть или пауза"></button><button class="rd" id="nx" aria-label="Вперёд"></button></div>
    <div class="ft">
      <button id="shuf" aria-label="Вперемешку"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h3l9 10h6M3 17h3l3-3.500M15 7h6M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
      <button id="rep" aria-label="Повтор"><svg class="i" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      <button class="hrt" id="hrt" aria-label="Нравится"></button>
      <button id="qb" aria-label="Очередь"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h7M16 15v6l5-3z"/></svg></button>
    </div>
  </div>

  <div class="pk" id="qk"><div><h4>Дальше в очереди</h4><p>Нажми на трек, чтобы включить</p><div id="ql"></div></div></div>
  <div class="pk" id="pk"><div><h4>Оформление</h4><p>Цвет акцента для всего приложения</p><div class="swt" id="sw"></div></div></div>
  <div class="toast" id="ts"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const hp=()=>navigator.vibrate&&navigator.vibrate(8);
const rnd=()=>Math.floor(Math.random()*T.length);
const PA=[["#8a4b2a","#2a120a","#f0b27a"],["#4b3a7a","#140f26","#c3b1ff"],["#1f5d5a","#08201f","#7fe0d0"],["#9a3b3b","#2a0d0d","#ffb0a0"],["#2f4f8f","#0c1630","#9cc4ff"],["#7a7a2f","#1f1f0a","#e6e08a"],["#6b4a2e","#21170f","#e7c9a0"],["#2f6b4f","#0a2218","#a5e8c4"],["#8a2f6a","#260a1c","#ff9fd6"],["#4a4a4a","#121212","#e8e0d4"]];
const P=PA.map((_,i)=>PA[(i*7+3)%10]);
const SH=[c=>`<circle cx="50" cy="46" r="24" fill="${c}"/><rect y="62" width="100" height="38" fill="rgba(0,0,0,.35)"/>`,
c=>`<path d="M22 100V52a28 28 0 0 1 56 0v48z" fill="${c}" opacity=".9"/><circle cx="78" cy="24" r="8" fill="${c}"/>`,
c=>`<circle cx="40" cy="50" r="26" fill="${c}" opacity=".85"/><circle cx="62" cy="50" r="26" fill="rgba(0,0,0,.35)"/>`,
c=>`<g fill="${c}" opacity=".85"><path d="M-10 70 70-10h14L-10 84z"/><path d="M10 110 110 10v16L26 110z"/><path d="M50 110 110 50v14L64 110z"/></g>`,
c=>`<path d="M0 100V30a70 70 0 0 1 70 70z" fill="${c}" opacity=".9"/><rect x="72" y="14" width="16" height="16" fill="${c}"/>`,
c=>`<g fill="none" stroke="${c}" stroke-width="7" opacity=".9"><path d="M14 100a36 36 0 0 1 72 0"/><path d="M28 100a22 22 0 0 1 44 0"/><path d="M42 100a8 8 0 0 1 16 0"/></g>`,
c=>`<g fill="${c}">${[25,50,75].map(y=>[25,50,75].map(x=>`<circle cx="${x}" cy="${y}" r="${x==50&&y==50?13:5}"/>`).join("")).join("")}</g>`,
c=>`<g fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"><path d="M0 40q25-20 50 0t50 0"/><path d="M0 56q25-20 50 0t50 0"/><path d="M0 72q25-20 50 0t50 0"/></g>`,
c=>`<path d="M42 26c0 6-1 9-6 12-9 6-12 18-8 30 2 6 6 9 9 10h26c3-1 7-4 9-10 4-12 1-24-8-30-5-3-6-6-6-12z" fill="rgba(0,0,0,.5)"/><rect y="80" width="100" height="20" fill="rgba(0,0,0,.35)"/><circle cx="76" cy="22" r="7" fill="${c}" opacity=".8"/>`,
c=>`<path d="M50 14a36 36 0 0 0 0 72z" fill="${c}"/><path d="M50 14a36 36 0 0 1 0 72z" fill="rgba(0,0,0,.35)"/>`];
const T=[["Nightfall","Hollow Years",277],["Ash & Amber","Hollow Years",213],["Low Tide Letters","Marren Vale",241],["Полночь","Сизый",198],["Glass Garden","Odd Hours",226],["Тихий свет","Лея Ветер",189],["Salt Road","Marren Vale",264],["Velvet Static","Odd Hours",205],["Слой за слоем","Сизый",232],["Paper Moons","Hollow Years",251]];
const PL=["Вечерний джаз","Дождь за окном","Утро без спешки","Ночной город","Глубокий фокус","Тёплый винил"];
const GN=["Инди","Эмбиент","Джаз","Фонк","Классика","Лоу-фай","Рок","Электроника"];
const cov=(i,ex="",label="")=>{const p=P[i%10];return `<div class="cv ${ex}" style="background:var(--nz),linear-gradient(150deg,${p[0]},${p[1]})"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">${SH[i%10](p[2])}</svg>${label?`<em class="cl">${esc(label)}</em>`:""}</div>`};
const FAB='<i class="fab"><svg class="i f" viewBox="0 0 24 24"><path d="M8 4.500v15a1 1 0 0 0 1.500.9l12-7.500a1 1 0 0 0 0-1.800l-12-7.500A1 1 0 0 0 8 4.500z"/></svg></i>';
const ic={play:'<svg class="i f" viewBox="0 0 24 24"><path d="M8 4.500v15a1 1 0 0 0 1.500.9l12-7.500a1 1 0 0 0 0-1.800l-12-7.500A1 1 0 0 0 8 4.500z"/></svg>',pause:'<svg class="i f" viewBox="0 0 24 24"><rect x="5.500" y="4" width="4.500" height="16" rx="1.300"/><rect x="14" y="4" width="4.500" height="16" rx="1.300"/></svg>',
prev:'<svg class="i" viewBox="0 0 24 24"><path d="M6 5v14M19 5.500v13L9 12z"/></svg>',next:'<svg class="i" viewBox="0 0 24 24"><path d="M18 5v14M5 5.500v13L15 12z"/></svg>',
heart:'<svg class="i" viewBox="0 0 24 24"><path d="M12 20.500s-8-4.900-8-11A4.600 4.600 0 0 1 12 6.600a4.600 4.600 0 0 1 8 2.900c0 6.100-8 11-8 11z"/></svg>'};
const bigI=s=>s.replace('class="i f"','class="i f" style="width:26px;height:26px"');
function toast(m){const t=$("#ts");t.textContent=m;t.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("on"),2200)}
$("#hi").textContent=(h=>h<6?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер")(new Date().getHours());

/* скелетоны */
const sk=(w,h,r=8,m=0)=>`<i class="sk" style="width:${w};height:${h};border-radius:${r}px;margin-bottom:${m}px"></i>`;
const skRows=n=>Array.from({length:n},()=>`<div class="tl" style="border:0"><i class="sk" style="width:48px;height:48px;flex:none"></i><div>${sk("60%","12px",6,8)}${sk("35%","10px",6)}</div></div>`).join("");
const skRow=()=>`<div class="row">${Array.from({length:4},()=>`<div style="flex:none;width:140px">${sk("140px","140px",10,8)}${sk("80%","12px",6,6)}${sk("50%","10px",6)}</div>`).join("")}</div>`;
$("#k0").innerHTML=sk("100%","208px",12)+`<div class="sec">${sk("45%","22px",6,12)}<div class="qg">${Array.from({length:6},()=>sk("100%","56px",10)).join("")}</div></div>`+[0,1].map(()=>`<div class="sec">${sk("50%","22px",6,12)}${skRow()}</div>`).join("");
$("#k1").innerHTML=`<div class="sec">${sk("55%","22px",6,12)}<div class="gg">${Array.from({length:6},()=>sk("100%","80px",12)).join("")}</div></div>`;
$("#k2").innerHTML=`<div style="margin-top:8px">${skRows(7)}</div>`;
function showLoad(i,ms){const s=$$(".scr")[i];s.classList.add("loading");setTimeout(()=>s.classList.remove("loading"),ms)}

/* отрисовка */
const tl=n=>`<button class="tl" data-t="${n}">${cov(n)}<div><b>${esc(T[n][0])}</b><span>${esc(T[n][1])}</span></div><em>${fm(T[n][2])}</em></button>`;
const mark=()=>$$("[data-t]").forEach(x=>x.classList.toggle("cur",+x.dataset.t===cur));
function home(){const m=a=>a.map(i=>i%T.length);
  $("#qg").innerHTML=m([0,3,5,2,8,4]).map(n=>`<button class="q" data-t="${n}">${cov(n)}<span>${PL[n%6]}</span></button>`).join("");
  $("#r1").innerHTML=PL.map((p,k)=>{const n=(k+1)%T.length;return `<button class="card" data-t="${n}"><div class="cw">${cov(n,"",p)}${FAB}</div><b>${p}</b><span>${esc(T[n][1])}</span></button>`}).join("");
  $("#r2").innerHTML=m([9,4,7,6,3,1]).map(n=>`<button class="card" data-t="${n}"><div class="cw">${cov(n)}${FAB}</div><b>${esc(T[n][0])}</b><span>${esc(T[n][1])}</span></button>`).join("");
  const seen=new Set(),ar=[];T.forEach((x,n)=>{if(!seen.has(x[1])){seen.add(x[1]);ar.push(n)}});
  $("#r3").innerHTML=ar.map(n=>`<button class="card r" data-t="${n}"><div class="cw">${cov(n)}${FAB}</div><b>${esc(T[n][1])}</b><span>Артист</span></button>`).join("");
  $("#gg").innerHTML=GN.map((g,n)=>`<button class="g" data-n="${n}" style="background:linear-gradient(150deg,${P[n][0]},${P[n][1]})">${g}<svg viewBox="0 0 100 100">${SH[n%10]("rgba(255,255,255,.75)")}</svg></button>`).join("");mark()}
function lib(){const ls=[...liked].map(tl).join("");
  $("#lib").innerHTML=(ls?`<h2>Понравилось</h2>${ls}<h2 style="margin-top:26px">Все треки</h2>`:`<p class="empty">Нажми на сердечко, и трек появится здесь.</p><h2>Все треки</h2>`)+T.map((_,n)=>tl(n)).join("");mark()}
$$(".scr").forEach(s=>s.addEventListener("scroll",()=>s.classList.toggle("sc",s.scrollTop>10),{passive:true}));

/* вкладки: при первом открытии показываем скелетон */
const seenTab=new Set([0]);
$$("#tabs button").forEach((b,k)=>b.onclick=()=>{hp();$$("#tabs button").forEach(x=>x.classList.toggle("on",x===b));$$(".scr").forEach((s,j)=>s.classList.toggle("on",j===k));
  if(k===2)lib();if(!seenTab.has(k)){seenTab.add(k);showLoad(k,650)}});

/* поиск */
let sto;$("#inp").oninput=ev=>{clearTimeout(sto);const q=ev.target.value.trim().toLowerCase();$("#gen").style.display=q?"none":"";
  if(!q){$("#sres").innerHTML="";return}
  $("#sres").innerHTML=`<div style="margin-top:12px">${skRows(4)}</div>`;
  sto=setTimeout(()=>{$("#sres").innerHTML=`<div class="real" style="margin-top:8px">`+(T.map((x,n)=>x.slice(0,2).join(" ").toLowerCase().includes(q)?tl(n):"").join("")||'<p class="empty">Ничего не найдено. Попробуй другой запрос.</p>')+"</div>";mark()},450)};

/* плеер */
let hist=[],cur=0,t=84,playing=true,drag=false,rep=false,shuf=false,liked=new Set([0]);
const nxt=()=>shuf?rnd():cur+1;
function setP(v){playing=v;document.body.classList.toggle("playing",v);const h=v?ic.pause:ic.play;$("#mpp").innerHTML=h;$("#ppl").innerHTML=h;$("#goWave").innerHTML=bigI(h)}
function syncLike(){const on=liked.has(cur);$("#hrt").classList.toggle("on",on);$("#mlk").classList.toggle("on",on)}
function load(n,at=0,dir=1,quiet=false){const nn=(n+T.length)%T.length;if(dir>0&&nn!==cur){hist.push(cur);if(hist.length>60)hist.shift()}cur=nn;t=at;const k=T[cur];$("#meta").classList.add("sx");
  $("#mcv").innerHTML=cov(cur);$("#mT").textContent=k[0];$("#mA").textContent=k[1];
  if(!quiet){const m=$("#mc");m.classList.remove("a1","a2");void m.offsetWidth;m.classList.add(dir>0?"a1":"a2")}
  const bg=$("#big");bg.innerHTML=cov(cur);bg.style.setProperty("--dx",dir*40+"px");bg.classList.remove("ch");void bg.offsetWidth;bg.classList.add("ch");
  $("#sh").style.background=`color-mix(in srgb,${P[cur%10][0]} 30%,#14100d)`;{const r=document.documentElement.style;r.setProperty("--tint",`color-mix(in srgb,${P[cur%10][0]} 55%,#15110e)`);r.setProperty("--ct",P[cur%10][0])}
  syncLike();mark();
  setTimeout(()=>{$("#pT").textContent=k[0];$("#pA").textContent=k[1];$("#meta").classList.remove("sx")},200);draw()}
const back=(q=false)=>load(hist.length?hist.pop():cur-1,0,-1,q);
function draw(){const d=T[cur][2],p=Math.min(100,t/d*100);$("#fl").style.width=p+"%";$("#th").style.left=p+"%";$("#mu").style.width=p+"%";$("#cu").textContent=fm(t);$("#du").textContent=fm(d)}
let last=performance.now();(function tick(n){const d=(n-last)/1000;last=n;
  if(playing&&!drag){t+=d;if(t>=T[cur][2]){rep?t=0:load(nxt())}draw()}requestAnimationFrame(tick)})(last);
const play=n=>{load(n);setP(true)};
function like(){hp();liked.has(cur)?liked.delete(cur):liked.add(cur);syncLike();[$("#hrt"),$("#mlk")].forEach(h=>{h.classList.remove("pop");void h.offsetWidth;h.classList.add("pop")})}
$("#hrt").onclick=like;$("#mlk").onclick=ev=>{ev.stopPropagation();like()};
$("#mpp").onclick=ev=>{ev.stopPropagation();hp();setP(!playing)};$("#ppl").onclick=()=>{hp();setP(!playing)};
$("#nx").onclick=()=>{hp();load(nxt(),0,1)};$("#pv").onclick=()=>{hp();t>3?(t=0,draw()):back()};
let wv=false;$("#goWave").onclick=()=>{hp();if(!wv){wv=true;play(rnd())}else setP(!playing)};
$("#shuf").onclick=ev=>{hp();shuf=!shuf;ev.currentTarget.classList.toggle("on",shuf);toast(shuf?"Вперемешку включено":"Вперемешку выключено")};
$("#rep").onclick=ev=>{hp();rep=!rep;ev.currentTarget.classList.toggle("on",rep);toast(rep?"Повтор трека включён":"Повтор выключен")};
$("#qb").onclick=()=>{$("#ql").innerHTML=skRows(5);$("#qk").classList.add("on");
  setTimeout(()=>{$("#ql").innerHTML=Array.from({length:Math.min(8,T.length-1)},(_,k)=>tl((cur+1+k)%T.length)).join("")},350)};
$("#qk").onclick=ev=>{if(ev.target.id==="qk")$("#qk").classList.remove("on")};
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-t],.g");if(!b)return;hp();$("#qk").classList.remove("on");play(b.classList.contains("g")?+b.dataset.n:+b.dataset.t)});
const sh=$("#sh"),app=$(".app"),scrim=$("#scrim"),mini=$("#mini");
const open=v=>{document.body.classList.toggle("po",v);sh.classList.toggle("on",v);sh.setAttribute("aria-hidden",!v)};
const AH=()=>app.clientHeight;
const vel=h=>h.length<2?0:(h[h.length-1].y-h[0].y)/Math.max(1,h[h.length-1].t-h[0].t);
const trk=(o,y)=>{const n=performance.now();o.h.push({y,t:n});o.h=o.h.filter(q=>q.t>n-90)};
/* шторка следует за пальцем: p от 0 (закрыта) до 1 (открыта) */
function coverAt(p){const b=$("#big"),B=b.offsetWidth,bx=b.offsetLeft+B/2,by=b.offsetTop+b.offsetHeight/2,mr=$("#mcv .cv").getBoundingClientRect(),ar=app.getBoundingClientRect();
  const mx=mr.left-ar.left+mr.width/2,my=mr.top-ar.top+mr.height/2,cx=mx+(bx-mx)*p,cy=my+(by-my)*p,sc=(mr.width+(B-mr.width)*p)/B;
  b.style.transform=`translate(${cx-bx}px,${cy-by-(1-p)*AH()}px) scale(${sc})`}
function prog(p){p=Math.max(0,Math.min(1,p));sh.classList.add("dg","ov");sh.style.transition="none";sh.style.transform=`translateY(${(1-p)*AH()}px)`;const r=20*(1-p);sh.style.borderRadius=`${r}px ${r}px 0 0`;
  sh.style.setProperty("--o",Math.min(1,p*2.2));coverAt(p);scrim.style.transition="none";scrim.style.opacity=p*.6;mini.style.transition="none";mini.style.opacity=1-Math.min(1,p*3)}
function settle(o){const b=$("#big");sh.classList.remove("dg");["transition","transform","borderRadius"].forEach(k=>sh.style[k]="");scrim.style.transition="";scrim.style.opacity="";mini.style.transition="";mini.style.opacity="";
  if(o){b.style.transition="";b.style.transform=""}else{b.style.transition="transform .6s var(--ease)";coverAt(0)}
  open(o);setTimeout(()=>{b.style.transition="";b.style.transform="";sh.classList.remove("ov")},o?900:700)}
$("#shx").onclick=()=>open(false);$("#pv").innerHTML=ic.prev;$("#nx").innerHTML=ic.next;$("#hrt").innerHTML=ic.heart;$("#mlk").innerHTML=ic.heart;
document.addEventListener("keydown",ev=>{if(ev.code==="Space"&&!/INPUT|BUTTON/.test(ev.target.tagName)){ev.preventDefault();setP(!playing)}});

/* мини-плеер: свайп вбок — листать (старый уезжает, новый грузится скелетоном), потянуть вверх — раскрыть плеер */
const mc=$("#mc"),mn=$("#mn"),mw=$("#mw");let mg=null,moved=false;
const SKM=`<i class="sk" style="width:44px;height:44px;flex:none"></i><div style="flex:1">${sk("55%","12px",6,8)}${sk("35%","10px",6)}</div>`;
const prevHTML=()=>{const i=hist.length?hist[hist.length-1]:(cur-1+T.length)%T.length;return `<div>${cov(i)}</div><div class="mt"><b>${esc(T[i][0])}</b><span>${esc(T[i][1])}</span></div>`};
mn.innerHTML=SKM;
mini.addEventListener("pointerdown",ev=>{if(ev.target.closest("button"))return;mg={x:ev.clientX,y:ev.clientY,a:null,h:[]}});
mini.addEventListener("pointermove",ev=>{if(!mg)return;const dx=ev.clientX-mg.x,dy=ev.clientY-mg.y;trk(mg,ev.clientY);
  if(!mg.a&&Math.max(Math.abs(dx),Math.abs(dy))>8){mg.a=Math.abs(dx)>Math.abs(dy)?"x":(dy<0?"y":"n");if(mg.a!=="n")mini.setPointerCapture(ev.pointerId)}
  if(mg.a==="x"){const W=mw.clientWidth,sg=dx<0?1:-1;if(mg.s!==sg){mg.s=sg;mn.innerHTML=sg>0?SKM:prevHTML()}mc.style.transition=mn.style.transition="none";mn.style.visibility="visible";mc.style.transform=`translateX(${dx}px)`;mn.style.transform=`translateX(${dx+(dx<0?W:-W)}px)`}
  if(mg.a==="y")prog(-dy*1.12/AH())});
function swipeEnd(dx){const W=mw.clientWidth;mc.style.transition=mn.style.transition="";
  if(Math.abs(dx)<60){mc.style.transform="";mn.style.transform=`translateX(${dx<0?W:-W}px)`;setTimeout(()=>{mn.style.visibility="hidden";mn.style.transform=""},330);return}
