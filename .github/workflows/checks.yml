name: GlukWave checks and builds
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'GlukWave Server URL'
        required: false
        default: 'https://wave.gluk.tech'
permissions:
  contents: read
jobs:
  web-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: GlukWave-web
          path: apps/web/dist
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Android build
        if: runner.os == 'Linux'
        run: |
          flutter build apk --debug --dart-define=GLUKWAVE_SERVER=${{ inputs.server_url || 'https://wave.gluk.tech' }}
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/GlukWave.apk
      - name: Windows release build
        if: runner.os == 'Windows'
        run: |
          flutter build windows --release --dart-define=GLUKWAVE_SERVER=${{ inputs.server_url || 'https://wave.gluk.tech' }}
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\x64\runner\GlukWave-windows-x64.zip -Force
      - name: iOS compile without signing
        if: runner.os == 'macOS'
        run: flutter build ios --release --no-codesign --dart-define=GLUKWAVE_SERVER=${{ inputs.server_url || 'https://wave.gluk.tech' }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: GlukWave-Android-APK
          path: apps/native/build/app/outputs/flutter-apk/GlukWave.apk
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: GlukWave-Windows-x64
          path: |
            apps/native/build/windows/x64/runner/GlukWave-windows-x64.zip
            apps/native/build/windows/x64/runner/Release/glukwave.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: GlukWave-ios-unsigned
          path: apps/native/build/ios/iphoneos/Runner.app
